quarkus.application.name=axon-ivy-rules-engine
quarkus.http.port=8080
quarkus.banner.enabled=false

# ---- Rules engine settings (override with environment variables, e.g. RULE_ENGINE_TYPE_CHECK) ----
# Strict inputs: a value that does not fit the declared type (e.g. outside of an enum) fails the evaluation.
rule.engine.type-check=true

%dev.quarkus.http.port=8090
# a free port: 8081, the default of Quarkus tests, is often taken by the engine of the Axon Ivy Designer
%test.quarkus.http.test-port=0

# ---- API contract ----
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=Axon Ivy Rules Engine - Runtime API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Loads DMN models at runtime, manages their versions and evaluates decisions.
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

quarkus.log.category."org.kie".level=WARN
quarkus.log.category."org.drools".level=WARN
