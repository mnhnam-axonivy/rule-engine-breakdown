<html xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:cc="jakarta.faces.composite"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pt="jakarta.faces.passthrough"
  xmlns:c="jakarta.tags.core">
<!--
  The tab "Rule Management" of the Admin Settings: the rules (DMN models) of the Axon Ivy Rules Engine.
  ruleManagementBean: com.axonivy.portal.bean.RuleManagementBean. It reaches the rule engine through
  com.axonivy.portal.rule.RuleEngineBridge, the Portal has no dependency on it.
-->
<cc:interface componentType="IvyComponent">
</cc:interface>

<cc:implementation>
  <c:set var="cmsPath" value="/ch.ivy.addon.portalkit.ui.jsf/components/RuleManagement/" />

  <p:messages id="rule-management-messages" globalOnly="true" closable="true" styleClass="rule-management-messages" />

  <h:panelGroup id="rule-management" layout="block" styleClass="rule-management">

    <!-- THE RULES -->
    <h:form id="rule-list-form">
      <div class="rule-management-header flex flex-wrap align-items-start justify-content-between gap-3 mb-3">
        <div class="rule-management-intro">
          <p class="m-0">#{ivy.cms.co(cmsPath.concat('Description'))}</p>
          <h:panelGroup styleClass="rule-runtime-state ok" rendered="#{ruleManagementBean.reachable}">
            <h:outputText value="#{ivy.cms.co(cmsPath.concat('RuntimeConnected'), [ruleManagementBean.runtimeUrl])}" />
          </h:panelGroup>
          <h:panelGroup styleClass="rule-runtime-state bad" rendered="#{!ruleManagementBean.reachable and ruleManagementBean.notConfigured}">
            <h:outputText value="#{ivy.cms.co(cmsPath.concat('Messages/NotConfigured'))}" />
          </h:panelGroup>
          <h:panelGroup styleClass="rule-runtime-state bad" rendered="#{!ruleManagementBean.reachable and !ruleManagementBean.notConfigured}">
            <h:outputText value="#{ivy.cms.co(cmsPath.concat('Messages/Unreachable'), [ruleManagementBean.runtimeUrl])}" />
          </h:panelGroup>
        </div>
        <p:commandButton id="refresh-rules" icon="ti ti-refresh" styleClass="ui-button-flat font-medium"
          value="#{ivy.cms.co(cmsPath.concat('Refresh'))}" ariaLabel="#{ivy.cms.co(cmsPath.concat('Refresh'))}"
          actionListener="#{ruleManagementBean.refresh}"
          update="@form :#{cc.clientId}:rule-management-messages" />
      </div>

      <p:dataTable id="rule-table" cellNavigation="false" widgetVar="ruleTable" styleClass="admin-table rule-table"
        value="#{ruleManagementBean.models}" var="model" filteredValue="#{ruleManagementBean.filteredModels}"
        reflow="true" lazy="false" rowKey="#{model.name}"
        emptyMessage="#{empty ruleManagementBean.loadProblem ? ivy.cms.co(cmsPath.concat('NoRules')) : ruleManagementBean.loadProblem}">
        <p:column id="rule-name-column" headerText="#{ivy.cms.co(cmsPath.concat('Rule'))}"
          filterBy="#{model.name}" filterMatchMode="contains" sortBy="#{model.name}" styleClass="rule-name-column">
          <div class="rule-name font-medium">#{model.name}</div>
          <h:panelGroup styleClass="rule-file" rendered="#{not empty model.project}">
            <i class="ti ti-file-code" aria-hidden="true" />
            <h:outputText value="#{ivy.cms.co(cmsPath.concat('FileOfProject'), [model.file, model.project])}" />
          </h:panelGroup>
        </p:column>
        <p:column headerText="#{ivy.cms.co(cmsPath.concat('Decisions'))}" styleClass="rule-decisions-column">
          <h:outputText value="#{ruleManagementBean.decisionNames(model)}" />
        </p:column>
        <p:column headerText="#{ivy.cms.co(cmsPath.concat('ActiveVersion'))}" styleClass="rule-active-column">
          <h:outputText styleClass="rule-badge rule-badge-active" rendered="#{model.onRuntime and model.activeVersion != null}"
            value="#{ivy.cms.co(cmsPath.concat('VersionLabel'), [model.activeVersion])}" />
          <h:outputText styleClass="rule-muted" rendered="#{model.onRuntime and model.activeVersion == null}"
            value="#{ivy.cms.co(cmsPath.concat('NoActiveVersion'))}" />
          <h:outputText styleClass="rule-badge rule-badge-new" rendered="#{!model.onRuntime}"
            value="#{ivy.cms.co(cmsPath.concat('NotOnRuntime'))}" />
        </p:column>
        <p:column headerText="#{ivy.cms.co(cmsPath.concat('Versions'))}" styleClass="rule-count-column text-center">
          <h:outputText value="#{model.versionCount}" />
        </p:column>
      </p:dataTable>
    </h:form>
  </h:panelGroup>
</cc:implementation>
</html>
